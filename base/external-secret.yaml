apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: my-app-secrets
  namespace: default
spec:
  refreshInterval: "1h"
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: native-k8s-secret
    creationPolicy: 'Owner'
  data:
    - secretKey: db-password
      remoteRef:
        key: my-app
        property: api-key
