apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-workload
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/kumar-venukrishnan/argocd-example-apps.git' # Replace with your actual repo
    targetRevision: HEAD
    path: base
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
